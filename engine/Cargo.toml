[package]
name = "nethance-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
ipstack = "1.0.1"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
system-configuration = "0.8.0"
tokio = { version = "1.54.1", features = ["full"] }
tun-rs = { version = "2.8.18", features = ["async"] }

[build-dependencies]
cc = "1.11.3"

# ipstack 1.0.1 with one fix: a client's RST wakes the stream (vendor/ipstack/src/stream/tcp.rs,
# "nethance patch"). Drop this once upstream releases the fix.
[patch.crates-io]
ipstack = { path = "vendor/ipstack" }
